<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0B72C4;--primary-hover:#095FA3;--dark:#0E4C86;--grad:linear-gradient(150deg,#1183CE,#0A4C86);--sky:#5BB4E8;--subtle:#E8F3FC;--subtle-bd:#CFE4F6;
--text:#12263A;--text2:#3C4A57;--text3:#6B7684;--border:#E2E9F0;--divider:#EDF1F5;--bg:#F1F3F6;--surface:#fff;
--pt:#F5A700;--pt-subtle:#FFF6E0;--pt-bd:#FFE2A3;--pt-text:#8A5A00;--ok:#15803D;--ok-bg:#E8F7EE;--shadow:0 4px 14px rgba(14,34,51,.06)}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
body{background:var(--bg)}
body.overlay{background:transparent}
button{font:inherit;cursor:pointer;border:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.coin{border-radius:50%;background:var(--pt);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{height:50px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;width:100%;transition:transform .12s ease-out,background .12s}
.btn:hover{background:var(--primary-hover)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--subtle);color:var(--primary);border:1px solid var(--subtle-bd)}
.btn:disabled{background:#E3EAF1;color:#9AA6B2;transform:none}
.pill{border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;padding:0 14px;height:38px;white-space:nowrap}
.done-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:13px;font-weight:700;padding:8px 12px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.link{color:var(--primary);font-weight:700;background:none;padding:0}
.muted{color:var(--text3)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,30,50,.45);animation:fade .3s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;background:var(--surface);padding:10px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;box-shadow:0 -12px 40px rgba(14,34,51,.18);animation:up .3s ease-out;max-height:100vh;overflow-y:auto}
.grip{width:40px;height:5px;border-radius:999px;background:#D5DEE7;align-self:center}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.hero{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--grad) center/cover no-repeat;flex:none}
.hero .top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center}
.chip-w{background:rgba(255,255,255,.92);color:var(--dark);font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.x{width:44px;height:44px;margin:-7px;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center}
.x span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text)}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--pt-subtle);border:1px solid var(--pt-bd)}
.ev-l{background:var(--pt);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.04em;flex-shrink:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{height:58px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:all .25s ease}
.tile small{font-size:10px;font-weight:600;opacity:.8}.tile b{font-size:11px;font-weight:800}
.tile.done{background:var(--subtle);border-color:var(--subtle-bd);color:var(--primary)}
.tile.today{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(11,114,196,.35)}
.tile.bonus{background:var(--pt-subtle);border-color:var(--pt-bd);color:var(--pt-text)}
.tile i{position:absolute;top:-8px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--pt);border:2px solid #fff;color:#fff;font-size:8px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center}
.today-box{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:#F5F8FB;border:1px solid var(--border)}
.mult{font-size:12px;font-weight:700;color:var(--primary);background:var(--subtle);padding:5px 10px;border-radius:999px;flex-shrink:0}
/* pages */
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;background:#fff;border-bottom:1px solid #E7EBF0}
.back{width:44px;height:44px;margin:-5px;border-radius:10px;background:none;font-size:24px;color:var(--text)}
.page{display:flex;flex-direction:column;gap:14px;padding-bottom:28px;max-width:480px;margin:0 auto}
.page>.card{margin:0 16px}
.prog{height:6px;border-radius:999px;overflow:hidden}.prog>div{height:100%;border-radius:999px;transition:width .4s ease-out}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list>div{padding:11px 0;border-top:1px solid var(--divider);min-height:56px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:#E3EAF1}
.seg button{height:38px;border-radius:9px;background:transparent;color:var(--text3);font-size:13.5px;font-weight:700}
.seg button[aria-pressed=true]{background:#fff;color:var(--primary)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.me{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;padding:12px 14px;border-radius:16px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(14,34,51,.3)}
.err{margin:24px 16px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--border);text-align:center;color:var(--text2)}
.skel{margin:16px;height:120px;border-radius:16px;background:linear-gradient(90deg,#E9EEF3,#F5F8FB,#E9EEF3);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="skel"></div></div>
<div class="sr" aria-live="polite" id="live"></div>
<script type="module">
// Views: ?view=sheet (transparent overlay above native Beranda) | card | poin | rank
// Token: #token=<CBN session JWT> (fragment never reaches server logs), or window.CBN_TOKEN injected by the app.
const qs = new URLSearchParams(location.search);
let view = qs.get('view') || 'poin';
const hashToken = new URLSearchParams(location.hash.slice(1)).get('token');
if (hashToken) { try { sessionStorage.setItem('cbn_t', hashToken); } catch {} history.replaceState(null, '', location.pathname + location.search); }
const token = () => window.CBN_TOKEN || hashToken || (() => { try { return sessionStorage.getItem('cbn_t'); } catch { return null; } })();
const device = qs.get('device') || '';

// Native bridge: React Native, iOS WKScriptMessageHandler "cbnCheckin", Android JS interface "CBNCheckin", or iframe parent.
function post(msg) {
  const s = JSON.stringify(msg);
  if (window.ReactNativeWebView) return ReactNativeWebView.postMessage(s), true;
  if (window.webkit?.messageHandlers?.cbnCheckin) return webkit.messageHandlers.cbnCheckin.postMessage(msg), true;
  if (window.CBNCheckin) return CBNCheckin.postMessage(s), true;
  if (parent !== window) return parent.postMessage({ cbnCheckin: msg }, '*'), true;
  return false;
}
const go = (v) => { if (!post({ type: 'navigate', view: v })) { view = v; sheetOpen = v === 'sheet'; render(); scrollTo(0, 0); } };
const close = () => { if (!post({ type: 'close' })) { if (view === 'rank') go('poin'); else { sheetOpen = false; render(); } } };

async function api(path, opts = {}) {
  const res = await fetch('/api/checkin' + path, { ...opts, headers: { authorization: 'Bearer ' + token(), 'content-type': 'application/json' } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) post({ type: 'unauthorized' });
  if (!res.ok && res.status !== 409) throw new Error(body.error || 'Gagal memuat. Coba lagi.');
  return body;
}

const fmt = (n) => Number(n).toLocaleString('id-ID');
const fm = (m) => String(m).replace('.', ',');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const hms = (ms) => new Date(ms + 7 * 3600e3).toISOString().slice(11, 19);
const ini = (n) => String(n || '?').split(/[\s.]+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const clock = (s) => [s / 3600, (s % 3600) / 60, s % 60].map((n) => String(Math.floor(n)).padStart(2, '0')).join(':');
const until = (ms) => { const s = Math.max(0, Math.floor((ms - now()) / 1000)), d = Math.floor(s / 86400); return (d ? d + 'h ' : '') + clock(s % 86400); };
const relDay = (day) => { const d = Math.round((Date.parse(S.today) - Date.parse(day)) / 864e5); return d === 0 ? 'Hari ini' : d === 1 ? 'Kemarin' : d + ' hari lalu'; };
const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

const ICON = {
  fire: (s, c = 'var(--pt)') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg>`,
  check: (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
  clock: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
};
const coin = (s) => `<span class="coin" style="width:${s}px;height:${s}px;font-size:${Math.round(s * 0.55)}px" aria-hidden="true">P</span>`;

let S = null, skew = 0, sheetOpen = view === 'sheet', board = null, mode = 'points', busy = false, err = '';
const now = () => Date.now() + skew; // server clock; countdowns never trust the phone clock

async function load() {
  try {
    S = await api('/state');
    skew = S.now - Date.now();
    err = '';
  } catch (e) { err = e.message; }
  render();
  if (view === 'rank') loadBoard();
}
async function loadBoard() {
  board = await api('/leaderboard?mode=' + mode).catch(() => null);
  render();
}
async function doClaim() {
  if (busy) return;
  busy = true; render();
  try {
    const r = await api('/claim', { method: 'POST', body: JSON.stringify({ device }) });
    S = r.state;
    post({ type: 'claimed', points: S.todayPoints.total, streak: S.streak, balance: S.balance });
  } catch (e) { err = e.message; }
  busy = false; render();
}
function dismiss() {
  if (S && !S.claimed) api('/dismiss', { method: 'POST' }).catch(() => {});
  close();
}

// ---------- pieces ----------
const mainEvent = () => S.events.find((e) => e.type !== 'challenge') || S.events[0];
function evSub(e) {
  if (e.type === 'time_window') {
    const t = hms(now());
    return t < e.windowStart ? `Mulai ${e.windowStart} WIB hari ini` : t < e.windowEnd ? `Berlaku sampai ${e.windowEnd} WIB hari ini` : `Sudah lewat ${e.windowEnd} · coba besok lebih pagi`;
  }
  if (e.type === 'challenge') return `Progres ${e.progress}/${e.targetDays} hari · berakhir <span class="cd" data-to="${e.endAt}">${until(e.endAt)}</span>`;
  return `Berakhir dalam <span class="cd" data-to="${e.endAt}">${until(e.endAt)}</span>`;
}
const evDesc = (e) => e.type === 'multiplier' ? `Poin harian (base + multiplier + bonus level) dikali ${fm(e.value)} selama event.`
  : e.type === 'time_window' ? `Check-in antara ${e.windowStart}–${e.windowEnd} WIB dapat +${fmt(e.value)} poin. Dihitung dari jam server, sampai detik.`
  : `Check-in ${e.targetDays} hari selama event, dapat +${fmt(e.value)} poin di hari ke-${e.targetDays}.`;
const evBanner = (e) => e ? `<div class="ev"><span class="ev-l">EVENT</span><div style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="font-size:13.5px">${esc(e.name)}</b><span class="num" style="font-size:11.5px;color:var(--pt-text)">${evSub(e)}</span></div><b style="font-size:15px;color:var(--pt-text)">${esc(e.tag)}</b></div>` : '';

const week = () => `<div class="week" role="list">${S.week.map((d) => {
  const cls = d.status === 'locked' && d.bonus ? 'bonus' : d.status;
  const label = d.status === 'done' ? 'selesai' : d.status === 'today' ? 'hari ini' : 'mendatang';
  return `<div class="tile ${cls}" role="listitem" aria-label="Hari ${d.day}, ${label}, ${d.points} poin">${d.eventTag && d.status !== 'done' ? `<i>${esc(d.eventTag)}</i>` : ''}<small>H${d.day}</small>${d.status === 'done' ? ICON.check(13) : `<b>+${fmt(d.points)}</b>`}</div>`;
}).join('')}</div>`;

function nextBonusText() {
  const n = S.nextBonus;
  return n.inDays === 0 ? 'Hari ini hari bonus!' : `Bonus +${fmt(n.points)} poin di hari ke-${n.day} ${n.inDays === 1 ? '(besok)' : `(${n.inDays} hari lagi)`}`;
}
const cd = () => `<span class="cd num" data-to="${S.resetAt}">${until(S.resetAt)}</span>`;
const claimBtn = (pill) => S.claimed ? `<span class="done-chip">${ICON.check(13)}Selesai</span>`
  : `<button class="${pill ? 'pill' : 'btn'}" data-a="${pill && view === 'card' ? 'open' : 'claim'}" ${busy ? 'disabled' : ''}>${pill ? `Klaim +${fmt(S.todayPoints.total)}` : esc(S.popup.button)}</button>`;
const bg = (u) => u ? ` style="background-image:url('${esc(u)}')"` : '';

function sheet() {
  const p = S.todayPoints;
  const evApplied = p.events.filter((e) => e.bonus);
  const body = !S.claimed ? `
    <div class="hero"${bg(S.popup.heroUrl)}><div class="top"><span class="chip-w">${ICON.fire(14)}Streak ${S.streak} hari</span><button class="x" data-a="dismiss" aria-label="Tutup"><span>×</span></button></div></div>
    ${evBanner(mainEvent())}
    <div class="row" style="align-items:flex-end"><div style="display:flex;flex-direction:column;gap:4px"><b id="t" style="font-size:21px;font-weight:800">${esc(S.popup.title)}</b><span class="muted" style="font-size:12.5px">${nextBonusText()}</span></div><span class="mult">×${fm(S.multiplier)}</span></div>
    ${week()}
    <div class="today-box"><div style="display:flex;flex-direction:column;gap:2px"><span class="muted" style="font-size:13px">Poin hari ini</span><button class="link" style="font-size:13px;text-align:left" data-go="poin">Lihat rincian ›</button></div><div style="display:flex;align-items:center;gap:8px">${coin(24)}<b style="font-size:28px;font-weight:800">+${fmt(p.total)}</b></div></div>
    ${claimBtn()}
    <div class="row"><span class="muted" style="display:flex;align-items:center;gap:6px;font-size:12.5px">${ICON.clock}Reset dalam <b style="color:var(--text)">${cd()}</b></span><button class="link" style="color:var(--text3);font-weight:600;font-size:14px;min-height:44px" data-a="dismiss">Nanti saja</button></div>`
  : `
    <div class="hero"${bg(S.popup.successUrl)}><div class="top"><span></span><button class="x" data-a="close" aria-label="Tutup"><span>×</span></button></div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
      <div style="display:flex;align-items:center;gap:8px">${coin(28)}<b id="t" style="font-size:30px;font-weight:800">+${fmt(p.total)} Poin</b></div>
      <span class="muted" style="font-size:14px">Streak ${S.streak} hari · saldo ${fmt(S.balance)} poin</span>
      ${evApplied.map((e) => `<span style="font-size:12.5px;font-weight:700;color:var(--pt-text)">Termasuk bonus ${esc(e.name)} +${fmt(e.bonus)}</span>`).join('')}
      <span class="num" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--dark);background:var(--subtle);padding:6px 12px;border-radius:999px">${ICON.clock}Tercatat ${hms(S.claimedAt)} WIB</span>
    </div>
    ${week()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn sec" data-go="poin">Poin Saya</button><button class="btn" data-a="close">Oke</button></div>`;
  return `<div class="scrim" data-a="${S.claimed ? 'close' : 'dismiss'}"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t"><div class="grip"></div>${body}</div>`;
}

function card() {
  const e = mainEvent();
  const sub = S.claimed ? `Tercatat ${hms(S.claimedAt)} · streak ${S.streak} hari` : `Streak ${S.streak} hari · reset ${cd()}`;
  return `<div class="card" style="margin:0 16px;padding:14px;display:flex;align-items:center;gap:12px;border-color:${S.claimed ? 'var(--border)' : '#BFDCF3'}">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--pt-subtle);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ICON.fire(22)}</div>
    <button data-go="poin" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;padding:0;text-align:left;color:inherit"><span style="display:flex;align-items:center;gap:6px"><b style="font-size:15px;font-weight:800">Check-in Harian</b>${e ? `<span style="background:var(--pt);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px">${esc(e.tag)}</span>` : ''}</span><span class="muted num" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</span></button>
    ${claimBtn(true)}</div>`;
}

function poin() {
  const p = S.todayPoints, lv = S.level, e = mainEvent();
  const pct = lv.next ? Math.min(100, Math.round(((S.lifetime - lv.min) / (lv.next.min - lv.min)) * 100)) : 100;
  const rows = [
    ['Base harian', fmt(S.basePoints), true],
    ['Multiplier streak ×' + fm(p.m), '= ' + fmt(p.base), true],
    [`Bonus Cybro ${lv.name} +${lv.pct}%`, p.lb ? '+' + fmt(p.lb) : '—', !!p.lb],
    ['Bonus hari ke-7', p.cycle ? '+' + fmt(p.cycle) : '—', !!p.cycle],
    [`Milestone ${S.claimed ? S.streak : S.streak + 1} hari`, p.milestone ? '+' + fmt(p.milestone) : '—', !!p.milestone],
    ...S.events.map((ev) => { const b = p.events.find((x) => x.id === ev.id)?.bonus || 0; return ['Event ' + ev.name, b ? '+' + fmt(b) : '—', !!b]; }),
  ];
  const r = S.rank;
  const gap = !r ? 'Check-in untuk masuk peringkat' : r.position <= S.boardSize ? `Anda di top ${S.boardSize}!` : S.boardCutoff != null ? `${fmt(S.boardCutoff - r.points + 1)} poin lagi ke top ${S.boardSize}` : '';
  return `<div class="bar"><button class="back" data-a="close" aria-label="Kembali">‹</button><b style="font-size:16.5px">Poin Saya</b></div>
  <div class="page">
    <div style="background:var(--grad);padding:18px;color:#fff;display:flex;flex-direction:column;gap:12px">
      <div class="row"><span style="font-size:13px;opacity:.9">Saldo poin</span><span style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px">Cybro ${esc(lv.name)} · +${lv.pct}%</span></div>
      <div style="display:flex;align-items:center;gap:10px">${coin(30)}<b class="num" style="font-size:32px;font-weight:800;letter-spacing:-.01em">${fmt(S.balance)}</b></div>
      <div class="prog" style="background:rgba(255,255,255,.25)" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%;background:#fff"></div></div>
      <span style="font-size:12px;opacity:.9">${fmt(S.lifetime)} poin seumur hidup · ${lv.next ? `${fmt(lv.next.min - S.lifetime)} lagi ke ${esc(lv.next.name)}` : 'level tertinggi'}</span>
    </div>
    <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:12px;background:var(--pt-subtle);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ICON.fire(20)}</div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><b style="font-size:15px">Streak ${S.streak} hari</b><span class="muted num" style="font-size:12px">${S.claimed ? `Tercatat ${hms(S.claimedAt)} WIB` : `×${fm(S.multiplier)} · reset ${cd()}`}</span></div>
      ${claimBtn(true)}
    </div>
    ${e ? `<div class="card" style="border-color:var(--pt-bd);overflow:hidden">
      <div style="position:relative;height:110px;background:linear-gradient(135deg,#FFB020,#F08A00) center/cover;${e.bannerUrl ? `background-image:url('${esc(e.bannerUrl)}')` : ''}"><span style="position:absolute;top:10px;left:10px;background:#fff;color:var(--pt-text);font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.04em">EVENT AKTIF</span></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px">
        <div class="row"><b style="font-size:15px">${esc(e.name)}</b><b style="font-size:15px;color:var(--pt-text)">${esc(e.tag)}</b></div>
        <span style="font-size:13px;color:var(--text2);line-height:1.5">${evDesc(e)}</span>
        ${e.type === 'challenge' ? `<div class="prog" style="background:#FFE9BF"><div style="width:${(e.progress / e.targetDays) * 100}%;background:var(--pt)"></div></div>` : ''}
        <span class="muted num" style="font-size:12px">${evSub(e)}</span>
      </div></div>` : ''}
    <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:9px">
      <b style="font-size:15px">Rincian poin hari ini${S.claimed ? '' : ' (kalau klaim sekarang)'}</b>
      ${rows.map(([k, v, on]) => `<div class="row" style="font-size:13.5px;opacity:${on ? 1 : 0.45}"><span class="muted">${esc(k)}</span><span style="font-weight:700">${v}</span></div>`).join('')}
      <div style="height:1px;background:var(--divider)"></div>
      <div class="row"><b style="font-size:14px">Total</b><b style="font-size:17px;color:var(--primary)">+${fmt(p.total)}</b></div>
    </div>
    <button class="card" data-go="rank" style="padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit">
      <span style="width:46px;height:46px;border-radius:12px;background:var(--subtle);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0">${r ? '#' + r.position : '–'}</span>
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">Peringkat bulan ini</b><span class="muted" style="font-size:12px">${gap}</span></span>
      <span style="font-size:18px;color:var(--primary)">›</span>
    </button>
    <div class="card" style="padding:4px 16px"><b style="display:block;font-size:15px;padding:12px 0 4px">Riwayat</b><div class="list">
      ${S.ledger.length ? S.ledger.flatMap((l) => {
        const t = `${relDay(l.day)} · ${hms(l.claimedAt)} WIB`;
        const line = (title, v) => `<div class="row"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13.5px;font-weight:600">${esc(title)}</span><span class="muted num" style="font-size:11.5px">${t}</span></div><b style="font-size:14px;color:var(--ok)">+${fmt(v)}</b></div>`;
        return [line('Check-in hari ke-' + l.streak, l.total - l.eventBonus), ...l.events.map((e) => line('Bonus ' + e.name, e.bonus))];
      }).join('') : '<div class="muted" style="font-size:13px">Belum ada riwayat. Klaim check-in pertama Anda hari ini.</div>'}
    </div></div>
  </div>`;
}

function rank() {
  const month = MONTHS[+S.today.slice(5, 7) - 1] + ' ' + S.today.slice(0, 4);
  const val = (u) => mode === 'points' ? fmt(u.value) + ' P' : u.value + ' hari';
  const top = board?.top || [];
  const pod = [[1, 60, 64, '#5BB4E8', '#C9D3DD'], [0, 76, 92, 'var(--primary)', 'var(--pt)'], [2, 60, 48, '#8FD0F5', '#E0B48A']];
  const me = board?.me;
  return `<div class="bar"><button class="back" data-go="poin" aria-label="Kembali">‹</button><div style="display:flex;flex-direction:column"><b style="font-size:16.5px">Peringkat Check-in</b><span class="muted" style="font-size:11.5px">Top ${S.boardSize} · ${month}</span></div></div>
  <div class="page" style="padding:14px 16px 110px">
    <div class="seg"><button aria-pressed="${mode === 'points'}" data-mode="points">Poin bulan ini</button><button aria-pressed="${mode === 'streak'}" data-mode="streak">Streak</button></div>
    ${!board ? '<div class="skel" style="margin:0"></div>' : !top.length ? '<div class="err" style="margin:0">Belum ada yang check-in. Jadilah yang pertama!</div>' : `
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end">${pod.map(([i, av, ped, bgc, ring]) => { const u = top[i]; return u ? `
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
        <div class="av" style="width:${av}px;height:${av}px;background:var(--subtle);color:var(--primary);font-size:20px;box-shadow:0 0 0 3px #fff,0 0 0 5px ${ring}">${esc(ini(u.name))}</div>
        <div style="display:flex;flex-direction:column;align-items:center;max-width:100%"><b style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(u.name)}</b><span style="font-size:12px;font-weight:700;color:var(--primary)">${val(u)}</span></div>
        <div style="width:100%;height:${ped}px;border-radius:12px 12px 6px 6px;background:${bgc};color:#fff;display:flex;justify-content:center;padding-top:8px;font-size:20px;font-weight:800">${i + 1}</div>
      </div>` : '<div></div>'; }).join('')}</div>
    <div class="card" style="padding:2px 14px">
      ${top.slice(3).map((u) => `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)"><span style="width:20px;font-size:13px;font-weight:700;color:var(--text3);text-align:center">${u.rank}</span><div class="av" style="width:36px;height:36px;background:#EEF2F6;color:var(--text2);font-size:13px">${esc(ini(u.name))}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:13.5px;font-weight:700">${esc(u.name)}</span><span class="muted num" style="font-size:11.5px">Check-in ${hms(u.lastAt)}</span></div><b style="font-size:13.5px">${val(u)}</b></div>`).join('')}
      <span class="muted" style="display:block;font-size:11.5px;padding:10px 0;line-height:1.5">Seri? Yang check-in lebih awal (sampai detik) di atas.</span>
    </div>`}
  </div>
  <div class="me"><b style="font-size:15px;min-width:32px">${me ? '#' + me.rank : '–'}</b><div class="av" style="width:36px;height:36px;background:rgba(255,255,255,.15);font-size:13px">${esc(ini(S.name))}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:13.5px;font-weight:700">${esc(S.name || 'Anda')} (Anda)</span><span class="num" style="font-size:11.5px;opacity:.8">${S.claimed ? `Check-in ${hms(S.claimedAt)} WIB` : 'Belum check-in hari ini'}</span></div><b style="font-size:13.5px">${me ? val(me) : mode === 'points' ? '0 P' : '0 hari'}</b></div>`;
}

function render() {
  const app = document.getElementById('app');
  document.body.classList.toggle('overlay', view === 'sheet' || view === 'card');
  if (err && !S) { app.innerHTML = `<div class="err">${esc(err)}<br><button class="btn" style="margin-top:12px" data-a="retry">Coba lagi</button></div>`; return; }
  if (!S) return;
  const html = view === 'sheet' ? (sheetOpen ? sheet() : '') : view === 'card' ? card() + (sheetOpen ? sheet() : '') : view === 'rank' ? rank() : poin();
  app.innerHTML = html + (err ? `<div class="err" role="alert">${esc(err)}</div>` : '');
  if (view === 'card' && !sheetOpen) post({ type: 'resize', height: document.body.scrollHeight });
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-a],[data-go],[data-mode]');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.mode) { mode = t.dataset.mode; board = null; render(); return loadBoard(); }
  ({ claim: doClaim, dismiss, close, retry: load, open: () => go('sheet') })[t.dataset.a]?.();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (view === 'sheet' || sheetOpen)) dismiss(); });

// Countdowns tick locally; screen readers get one update per minute. Day rollover refetches state.
let lastMin = -1;
setInterval(() => {
  document.querySelectorAll('.cd').forEach((el) => (el.textContent = until(+el.dataset.to)));
  if (S && now() >= S.resetAt) load();
  const m = Math.floor(now() / 60000);
  if (S && m !== lastMin && !S.claimed) { lastMin = m; document.getElementById('live').textContent = 'Reset check-in dalam ' + until(S.resetAt).slice(0, -3).replace(':', ' jam ') + ' menit'; }
}, 1000);
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
window.addEventListener('message', (e) => e.data?.cbnCheckin === 'reload' && load());

load();
</script>
</body>
</html>
