<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0B72C4;--primary-hover:#095FA3;--dark:#0E4C86;--grad:linear-gradient(150deg,#1183CE,#0A4C86);--sky:#5BB4E8;--subtle:#E8F3FC;--subtle-bd:#CFE4F6;
--text:#12263A;--text2:#3C4A57;--text3:#6B7684;--border:#E2E9F0;--divider:#EDF1F5;--bg:#F1F3F6;--surface:#fff;
--pt:#F5A700;--pt-subtle:#FFF6E0;--pt-bd:#FFE2A3;--pt-text:#8A5A00;--ok:#15803D;--ok-bg:#E8F7EE;--shadow:0 4px 14px rgba(14,34,51,.06)}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
body{background:var(--bg)}
button{font:inherit;cursor:pointer;border:none}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.coin{border-radius:50%;background:var(--pt);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{height:50px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;width:100%;transition:transform .12s ease-out,background .12s}
.btn:hover{background:var(--primary-hover)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--subtle);color:var(--primary);border:1px solid var(--subtle-bd)}
.btn:disabled{background:#E3EAF1;color:#9AA6B2;transform:none}
.pill{border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;padding:0 14px;height:38px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.muted{color:var(--text3)}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--pt-subtle);border:1px solid var(--pt-bd)}
.ev-l{background:var(--pt);color:#fff;font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.04em;flex-shrink:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.tile{height:58px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:all .25s ease}
.tile small{font-size:10px;font-weight:600;opacity:.8}.tile b{font-size:11px;font-weight:800}
.tile.done{background:var(--subtle);border-color:var(--subtle-bd);color:var(--primary)}
.tile.today{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(11,114,196,.35)}
.tile.bonus{background:var(--pt-subtle);border-color:var(--pt-bd);color:var(--pt-text)}
.tile i{position:absolute;top:-8px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--pt);border:2px solid #fff;color:#fff;font-size:8px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center}
.today-box{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;background:#F5F8FB;border:1px solid var(--border)}
.mult{font-size:12px;font-weight:700;color:var(--primary);background:var(--subtle);padding:5px 10px;border-radius:999px;flex-shrink:0}
/* pages -aj */
.page{display:flex;flex-direction:column;gap:14px;padding-bottom:28px;max-width:480px;margin:0 auto}
.page>.card{margin:0 16px}
.prog{height:6px;border-radius:999px;overflow:hidden}.prog>div{height:100%;border-radius:999px;transition:width .4s ease-out}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list>div{padding:11px 0;border-top:1px solid var(--divider);min-height:56px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:#E3EAF1}
.seg button{height:38px;border-radius:9px;background:transparent;color:var(--text3);font-size:13.5px;font-weight:700}
.seg button[aria-pressed=true]{background:#fff;color:var(--primary)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.me{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;padding:12px 14px;border-radius:16px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(14,34,51,.3)}
.err{margin:24px 16px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--border);text-align:center;color:var(--text2)}
.skel{margin:16px;height:120px;border-radius:16px;background:linear-gradient(90deg,#E9EEF3,#F5F8FB,#E9EEF3);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--grad) center/cover no-repeat;flex:none}
.chip-w{background:rgba(255,255,255,.92);color:var(--dark);font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;position:absolute;top:10px;left:10px}
/* toast (mode=toast): the WebView itself is transparent, full width - 24pt, pinned under the status bar -aj */
body.toast{background:transparent;padding:0 0 18px}
.toast-card{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:14px;background:#fff;border:1px solid var(--subtle-bd);box-shadow:0 12px 30px rgba(14,34,51,.18);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-120%);opacity:0}}
.toast-card .open{flex:1;min-width:0;display:flex;flex-direction:column;background:none;padding:0;text-align:left;color:inherit}
.toast-card .x{width:44px;height:44px;margin:-9px -9px -9px -6px;border-radius:50%;background:none;color:var(--text3);font-size:18px;flex-shrink:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subbar{display:flex;align-items:center;gap:6px;margin:14px 16px 0}
.subbar button{width:44px;height:44px;margin:-6px;border-radius:10px;background:none;font-size:24px;color:var(--text)}
</style>
</head>
<body>
<div id="app"></div>
<div class="sr" aria-live="polite" id="live"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
