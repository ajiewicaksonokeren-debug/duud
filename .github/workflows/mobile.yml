name: Mobile build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['client/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

# The native app has no same-origin backend, so the API URL is baked in at build time.
# Set it in Settings → Secrets and variables → Actions → Variables → VITE_API_URL.
env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}

defaults:
  run:
    working-directory: client

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android
      - uses: actions/upload-artifact@v4
        with:
          name: tebak-gambar-android-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Unsigned simulator build: proves the project compiles. A device/App Store build
      # needs an Apple Developer account + signing certificate and provisioning profile.
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - run: cd ios/build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../../App-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: tebak-gambar-ios-simulator
          path: client/App-simulator.zip
