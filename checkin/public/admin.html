<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0B72C4;--dark:#0E4C86;--subtle:#E8F3FC;--text:#12263A;--text2:#3C4A57;--text3:#6B7684;--border:#E2E9F0;--divider:#EDF1F5;--bg:#F1F3F6;--pt:#F5A700;--pt-subtle:#FFF6E0;--pt-text:#8A5A00;--ok:#15803D;--ok-bg:#E8F7EE;--danger:#E11D2E}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.num{font-variant-numeric:tabular-nums}
.wrap{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:#fff;border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{font-size:20px;font-weight:800;padding:0 10px 16px}
nav button{text-align:left;padding:10px 12px;border-radius:10px;background:none;font-weight:600;color:var(--text2)}
nav button[aria-current=true]{background:var(--subtle);color:var(--primary)}
main{padding:24px 28px 96px;display:flex;flex-direction:column;gap:18px;min-width:0}
h1{margin:0;font-size:24px;font-weight:800}
.sub{color:var(--text3);margin:4px 0 0}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(14,34,51,.06)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{display:block;font-size:26px;font-weight:800;margin-top:4px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
label small{color:var(--text3);font-weight:500}
input,select{height:40px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:#fff;min-width:0}
input[type=checkbox]{height:18px;width:18px}
.btn{height:40px;padding:0 16px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700}
.btn.sec{background:var(--subtle);color:var(--primary)}
.btn.ghost{background:none;color:var(--text3)}
.btn.danger{background:none;color:var(--danger)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--text3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--divider);vertical-align:top}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px}
.bars div{flex:1;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.two>*{min-width:0}
td input{width:100%}
.save{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 12px 10px 18px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px rgba(14,34,51,.3)}
.toast{position:fixed;right:20px;top:20px;background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;max-width:360px}
.toast.bad{background:var(--danger)}
.login{max-width:360px;margin:15vh auto;display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto}nav .logo{display:none}.two{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/admin.js"></script>
</body>
</html>
